<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meter Readings Updater - Shops</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: white;
            --border-color: #dee2e6;
        }
        .dark-mode {
            --bg-color: #121212;
            --text-color: white;
            --card-bg: #e0e0e0;
            --border-color: #ccc;
        }
        .dark-mode .card {
            color: black;
        }
        .dark-mode .btn-outline-secondary {
            border-color: white;
            color: white;
        }
        .dark-mode .btn-outline-secondary:hover {
            background-color: #666;
            border-color: #666;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .card {
            background-color: var(--card-bg);
            border-color: var(--border-color);
            color: var(--text-color);
        }
        input { background-color: white; color: black; }
    </style>
</head>
<body>
    <div class="position-fixed top-0 end-0 p-3">
        <button id="theme-toggle" class="btn btn-outline-secondary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>
    </div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Meter Readings Updater - Shops</h1>

        <h2>Shops Found</h2>
        <ul id="shops-list" class="list-group mb-4"></ul>
        <div class="card p-4">
            <div class="mb-3">
                <label for="dates" class="form-label">Enter new dates (comma-separated, e.g., 20-03-2012,21-03-2012):</label>
                <input type="text" class="form-control" id="dates">
            </div>
            <div class="mb-3">
                <label for="format" class="form-label">Choose Date Format:</label>
                <select class="form-select" id="format">
                    <option value="dd-mm-yyyy">dd-mm-yyyy</option>
                    <option value="dd/mm/yyyy">dd/mm/yyyy</option>
                    <option value="dd-mm-yy">dd-mm-yy</option>
                    <option value="dd/mm/yy">dd/mm/yy</option>
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <button class="btn btn-secondary" onclick="window.location.href='index.html'">Back</button>
                <button class="btn btn-primary" onclick="processDates()">Next</button>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle
        const toggle = document.getElementById('theme-toggle');
        const body = document.body;
        const sunIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
        const moonIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            toggle.innerHTML = sunIcon;
        } else {
            toggle.innerHTML = moonIcon;
        }

        toggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            toggle.innerHTML = isDark ? sunIcon : moonIcon;
        });

        // Load data
        const shops = JSON.parse(localStorage.getItem('shops') || '[]');
        const list = document.getElementById('shops-list');
        list.innerHTML = '';
        shops.forEach(shop => {
            const li = document.createElement('li');
            li.className = 'list-group-item';
            li.textContent = shop;
            list.appendChild(li);
        });

        function parseDate(dateStr, format) {
            const sep = format.includes('-') ? '-' : '/';
            const parts = dateStr.split(sep);
            let day, month, year;
            if (format.startsWith('dd')) {
                day = parseInt(parts[0]);
                month = parseInt(parts[1]) - 1;
                year = parseInt(parts[2]);
            }
            if (year < 100) year += 2000;
            return new Date(year, month, day);
        }

        function formatDate(date, format) {
            const d = new Date(date);
            const day = d.getDate().toString().padStart(2, '0');
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const year = format.includes('yyyy') ? d.getFullYear() : d.getFullYear().toString().slice(-2);
            const sep = format.includes('/') ? '/' : '-';
            return `${day}${sep}${month}${sep}${year}`;
        }

        function processDates() {
            const datesInput = document.getElementById('dates').value;
            const dates = datesInput.split(',').map(d => d.trim());
            const format = document.getElementById('format').value;
            const existingFormat = localStorage.getItem('existingFormat');
            const existingData = JSON.parse(localStorage.getItem('existingData') || '{}');
            const existingDates = Object.keys(existingData).map(k => k.split('_')[1]).filter((v, i, a) => a.indexOf(v) === i);
            const existingDateObjs = existingDates.map(d => parseDate(d, existingFormat));
            const newDateObjs = dates.map(d => parseDate(d, format));
            const duplicates = newDateObjs.filter(newD => existingDateObjs.some(existingD => existingD.getTime() === newD.getTime()));
            if (duplicates.length > 0) {
                alert('Some dates already exist. They will be updated.');
            }
            const formattedDates = dates.map(d => formatDate(parseDate(d, format), existingFormat));
            localStorage.setItem('dates', JSON.stringify(formattedDates));
            window.location.href = 'readings.html';
        }
    </script>
</body>
</html>
