<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meter Readings Updater - Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: white;
            --border-color: #dee2e6;
        }
        .dark-mode {
            --bg-color: #121212;
            --text-color: white;
            --card-bg: #e0e0e0;
            --border-color: #ccc;
        }
        .dark-mode .card {
            color: black;
        }
        .dark-mode .btn-outline-secondary {
            border-color: white;
            color: white;
        }
        .dark-mode .btn-outline-secondary:hover {
            background-color: #666;
            border-color: #666;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .card {
            background-color: var(--card-bg);
            border-color: var(--border-color);
            color: var(--text-color);
        }
        input { background-color: white; color: black; }
    </style>
</head>
<body>
    <div class="position-fixed top-0 end-0 p-3">
        <button id="theme-toggle" class="btn btn-outline-secondary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>
    </div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Meter Readings Updater - Preview</h1>

        <h2>Preview of Updated Database</h2>
        <div class="table-responsive">
            <table class="table table-striped table-bordered" id="preview-table"></table>
        </div>
        <div class="mt-4">
            <label for="filename" class="form-label">Output Filename (e.g., updated):</label>
            <input type="text" class="form-control" id="filename" style="width: auto; display: inline-block;">
            <button class="btn btn-success ms-2" onclick="downloadFile()">Download Excel File</button>
        </div>
        <div class="mt-3">
            <button class="btn btn-secondary" onclick="window.location.href='readings.html'">Back</button>
            <button class="btn btn-info" onclick="window.location.href='index.html'">Import New Database</button>
        </div>
    </div>

    <script>
        // Theme toggle
        const toggle = document.getElementById('theme-toggle');
        const body = document.body;
        const sunIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
        const moonIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            toggle.innerHTML = sunIcon;
        } else {
            toggle.innerHTML = moonIcon;
        }

        toggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            toggle.innerHTML = isDark ? sunIcon : moonIcon;
        });

        // Load data
        const shops = JSON.parse(localStorage.getItem('shops') || '[]');
        const dates = JSON.parse(localStorage.getItem('dates') || '[]');
        const existingData = JSON.parse(localStorage.getItem('existingData') || '{}');

        // Get all dates
        const allDates = [...new Set(Object.keys(existingData).map(k => k.split('_')[1]))].sort();

        // Show preview table
        const table = document.getElementById('preview-table');
        table.innerHTML = '';
        const thead = document.createElement('thead');
        thead.className = 'table-dark';
        const headerRow = document.createElement('tr');
        headerRow.innerHTML = '<th>Shop</th>' + allDates.map(d => `<th>${d}</th>`).join('');
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        shops.forEach(shop => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${shop}</td>` + allDates.map(d => `<td>${existingData[`${shop}_${d}`] || ''}</td>`).join('');
            tbody.appendChild(row);
        });
        table.appendChild(tbody);

        function downloadFile() {
            const filename = document.getElementById('filename').value || 'updated';
            const data = JSON.parse(localStorage.getItem('data') || '[]');
            // Update data with new readings
            const headers = data[1];
            for (let i = 2; i < data.length; i++) {
                const row = data[i];
                if (row[0]) {
                    for (let j = 1; j < headers.length; j++) {
                        const key = `${row[0]}_${headers[j]}`;
                        if (existingData[key] !== undefined) {
                            row[j] = existingData[key];
                        }
                    }
                    // Add new dates
                    dates.forEach(d => {
                        const idx = headers.indexOf(d);
                        if (idx === -1) {
                            headers.push(d);
                            row.push(existingData[`${row[0]}_${d}`] || '');
                        } else {
                            row[idx] = existingData[`${row[0]}_${d}`] || '';
                        }
                    });
                }
            }
            // Update first row if needed
            data[0] = ['', 'meter readings for days'];
            data[1] = ['shop name', ...headers.slice(1)];

            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
            XLSX.writeFile(wb, `${filename}.xlsx`);
        }
    </script>
</body>
</html>
