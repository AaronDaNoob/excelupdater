<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meter Readings Updater - Readings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: white;
            --border-color: #dee2e6;
        }
        .dark-mode {
            --bg-color: #121212;
            --text-color: white;
            --card-bg: #e0e0e0;
            --border-color: #ccc;
        }
        .dark-mode .card {
            color: black;
        }
        .dark-mode .btn-outline-secondary {
            border-color: white;
            color: white;
        }
        .dark-mode .btn-outline-secondary:hover {
            background-color: #666;
            border-color: #666;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .card {
            background-color: var(--card-bg);
            border-color: var(--border-color);
            color: var(--text-color);
        }
        input { background-color: white; color: black; }
    </style>
</head>
<body>
    <div class="position-fixed top-0 end-0 p-3">
        <button id="theme-toggle" class="btn btn-outline-secondary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>
    </div>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Meter Readings Updater - Readings</h1>

        <h2>Enter Meter Readings</h2>
        <button class="btn btn-info mb-3" onclick="toggleData()">Display Existing Data</button>
        <div id="existing-data" style="display: none;">
            <h3>All Existing Readings</h3>
            <div class="table-responsive">
                <table class="table table-striped table-bordered" id="existing-table"></table>
            </div>
        </div>
        <form id="readings-form">
            <div class="table-responsive">
                <table class="table table-striped table-bordered" id="readings-table"></table>
            </div>
            <div class="d-flex justify-content-between mt-3">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='shops.html'">Back</button>
                <button type="button" class="btn btn-primary" onclick="previewData()">Next</button>
            </div>
        </form>
    </div>

    <script>
        // Theme toggle
        const toggle = document.getElementById('theme-toggle');
        const body = document.body;
        const sunIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
        const moonIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            body.classList.add('dark-mode');
            toggle.innerHTML = sunIcon;
        } else {
            toggle.innerHTML = moonIcon;
        }

        toggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            toggle.innerHTML = isDark ? sunIcon : moonIcon;
        });

        // Load data
        const shops = JSON.parse(localStorage.getItem('shops') || '[]');
        const dates = JSON.parse(localStorage.getItem('dates') || '[]');
        let existingData = JSON.parse(localStorage.getItem('existingData') || '{}');

        // Show readings table
        const table = document.getElementById('readings-table');
        table.innerHTML = '';
        const thead = document.createElement('thead');
        thead.className = 'table-dark';
        const headerRow = document.createElement('tr');
        headerRow.innerHTML = '<th>Shop</th>' + dates.map(d => `<th>${d}</th>`).join('');
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        shops.forEach(shop => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${shop}</td>` + dates.map(d => `<td><input type="text" name="${shop}_${d}" value="${existingData[`${shop}_${d}`] || ''}" required></td>`).join('');
            tbody.appendChild(row);
        });
        table.appendChild(tbody);

        function toggleData() {
            const div = document.getElementById('existing-data');
            div.style.display = div.style.display === 'none' ? 'block' : 'none';
            if (div.style.display === 'block') {
                const table = document.getElementById('existing-table');
                table.innerHTML = '';
                const thead = document.createElement('thead');
                thead.className = 'table-dark';
                const headerRow = document.createElement('tr');
                headerRow.innerHTML = '<th>Shop</th>' + Object.keys(existingData).filter(k => k.includes('_')).map(k => k.split('_')[1]).filter((v, i, a) => a.indexOf(v) === i).map(d => `<th>${d}</th>`).join('');
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                shops.forEach(shop => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${shop}</td>` + Object.keys(existingData).filter(k => k.startsWith(shop + '_')).map(k => `<td>${existingData[k]}</td>`).join('');
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);
            }
        }

        function previewData() {
            // Collect readings
            const inputs = document.querySelectorAll('#readings-table input');
            inputs.forEach(input => {
                const [shop, date] = input.name.split('_');
                existingData[`${shop}_${date}`] = input.value;
            });

            localStorage.setItem('existingData', JSON.stringify(existingData));
            window.location.href = 'preview.html';
        }
    </script>
</body>
</html>
